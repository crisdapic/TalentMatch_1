<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} - Talent Match</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f5f6f8;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input,
        textarea,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
        }

        .errorlist {
            color: #dc2626;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .button {
            padding: 10px 16px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }

        .secondary {
            background: #e5e7eb;
            color: #111827;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>{{ page_title }}</h1>

    <form method="post">
        {% csrf_token %}

        {% for field in form %}
            <div class="field">

                {{ field.label_tag }}

                {{ field }}

                {% if field.help_text %}
                    <small>{{ field.help_text }}</small>
                {% endif %}

                {{ field.errors }}

            </div>
        {% endfor %}

        <div class="actions">
            <button class="button" type="submit">
                Guardar
            </button>

            <a class="button secondary"
               href="{% url 'recruitment:task_list' %}">
                Cancelar
            </a>
        </div>
    </form>

</div>

</body>
</html>
